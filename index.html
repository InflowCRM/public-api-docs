<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="InflowCRM Public API Documentation — REST and GraphQL API reference">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" href="logo.png" type="image/png">
  <!-- Themes (light + dark) -->
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

</head>
<body>
  <div id="app"></div>
  <script>
    // Links published before relativePath was enabled pointed at #/clients, #/tools and #/skill.
    var legacyMcpPage = location.hash.match(/^#\/(clients|tools|skill)(\?.*)?$/);
    if (legacyMcpPage) {
      location.replace('#/docs/mcp/' + legacyMcpPage[1] + (legacyMcpPage[2] || ''));
    }
  </script>
  <script>
    window.$docsify = {
      name: 'InflowCRM API Documentation',
      logo: 'logo.png',
      repo: 'https://github.com/InflowCRM/public-api-docs',
      loadSidebar: true,
      homepage: 'README.md',
      relativePath: true,
      themeable: {
        readyTransition : true,
        responsiveTables: true
      }
    };
  </script>
  
  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- Recommended -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"></script>
</body>
</html>
